[project]
name = "hearth"
version = "0.1.0"
description = "An on-call rotation for the people who raised you. Family care coordination on Switch."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "websockets>=13.0",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
    "fpdf2>=2.7",
]

[project.scripts]
hearth-register = "hearth.register:main"
hearth-setup = "hearth.pulse.agent:setup_main"
hearth-pulse = "hearth.pulse.agent:main"
hearth-companion = "hearth.companion.agent:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
